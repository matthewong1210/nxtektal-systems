[project]
name = "nxt-sim"
version = "0.1.0"
description = "NXTektal Virtual Handoff Lab v0.1 - simulator-independent docking/handoff validation environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 0.5 Range Operations Training Environment (nxt_range_ops).
# Kept out of core dependencies so the Phase 0 handoff lab stays minimal.
# NOTE: these are *simulation* dependencies; RL training frameworks are
# deliberately NOT added (see docs/range_ops.md, "Training frameworks").
range-ops = [
    "simpy>=4.1",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pyarrow>=16.0",
]
# Streamlit demo viewer (nxt_range_demo) — presentation only, reads exported
# bundles from nxt_range_viewer; no simulator dependency.
demo = [
    "streamlit>=1.37",
    "plotly>=5.22",
]
# USD digital twin (nxt_range_twin) — optional gated by byte-determinism
# release-blocker spike (design §4.3).
twin = ["usd-core==26.8"]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# nxt_range_agent (benchmarks) and nxt_range_viewer (demo replay exporter)
# are deliberately in-repo-only tools and excluded from the wheel; they run
# via `python -m ...` from the repo root (pytest pythonpath below).
# nxt_facility is the Site OS state contract consumed by future agents and
# services, so it ships in the wheel alongside the simulator it projects.
# nxt_memory is the auditable operational-memory layer (Phase 3).
# nxt_telemetry is the observation input boundary (Phase 4A).
# nxt_range_twin is the digital twin / spatial intelligence projection layer.
# nxt_pilot_ops is the downstream Shadow Ops recommendation/audit layer.
# nxt_commissioning is the physical facility source-of-truth layer.
# nxt_site_runtime orchestrates observation assembly, quality gates, recovery,
# and downstream publication without owning any domain state or decisions.
# nxt_agent_runtime is the deterministic composition/lifecycle layer that runs
# Site Runtime output through Shadow Ops evaluation with restart-safe
# evaluation checkpoints; it owns no state, policy, or execution semantics.
# nxt_edge_observation converts already-read raw device samples into the
# existing canonical Observation contract. It is transport-neutral and
# fixture-backed: no live transport, physical device, or command surface.
# nxt_workflow_enablement is the deterministic multi-workflow commissioning
# readiness layer: workflow identity registration, per-workflow requirement
# evaluation, the enablement report, and fixture-only launch-plan data. It
# owns no observation, state, policy, runtime, or execution semantics.
packages = ["nxt_sim", "nxt_range_ops", "nxt_facility", "nxt_memory", "nxt_telemetry", "nxt_range_twin", "nxt_pilot_ops", "nxt_commissioning", "nxt_site_runtime", "nxt_agent_runtime", "nxt_edge_observation", "nxt_workflow_enablement"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "slow: full-episode re-runs (SimPy event clock: ~1s per simulated day, measured)",
]
