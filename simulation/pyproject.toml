[project]
name = "nxt-sim"
version = "0.1.0"
description = "NXTektal Virtual Handoff Lab v0.1 - simulator-independent docking/handoff validation environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 0.5 Range Operations Training Environment (nxt_range_ops).
# Kept out of core dependencies so the Phase 0 handoff lab stays minimal.
# NOTE: these are *simulation* dependencies; RL training frameworks are
# deliberately NOT added (see docs/range_ops.md, "Training frameworks").
range-ops = [
    "simpy>=4.1",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pyarrow>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nxt_sim", "nxt_range_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
