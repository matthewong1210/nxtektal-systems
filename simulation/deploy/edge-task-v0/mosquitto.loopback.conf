# Edge Task Exchange V0 -- local rehearsal broker. SIMULATION ONLY.
# Loopback-bound on a task-specific port so it never touches a shared or
# site broker. Nonpersistent: a broker restart is a transport session loss
# that both endpoints must recover from through their own journals.
listener 18830 127.0.0.1
allow_anonymous true
persistence false
max_packet_size 65536
log_dest stdout
connection_messages true
