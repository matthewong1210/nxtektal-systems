        <path d="M-7 0 L-2 5 8 -6" fill="none" stroke="#b7ffcf" stroke-width="2.5" />
        <text x="0" y="47" fill="#a6b7ad" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OUTCOME</text>
      </g>
