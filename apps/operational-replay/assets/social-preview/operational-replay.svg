      <circle cx="810" cy="140" r="4" fill="#63f59c" />
      <circle cx="1037" cy="140" r="4" fill="#63f59c" />
      <circle cx="810" cy="459" r="4" fill="#63f59c" />
      <circle cx="1037" cy="459" r="4" fill="#63f59c" />

      <text x="923" y="153" fill="#8db09c" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">EDGE GATEWAY</text>
