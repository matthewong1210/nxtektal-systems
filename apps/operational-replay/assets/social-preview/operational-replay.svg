      <g transform="translate(491 495)">
        <circle r="17" fill="#0d1612" stroke="#63f59c" stroke-width="2" />
        <rect x="-7" y="-7" width="14" height="14" fill="none" stroke="#b7ffcf" stroke-width="2" />
        <text x="0" y="47" fill="#a6b7ad" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">TASK</text>
      </g>
      <g transform="translate(624 495)">
