      <rect x="823" y="301" width="89" height="65" rx="5" fill="#121d19" stroke="#4d8062" />
      <g fill="#63f59c">
        <circle cx="839" cy="333" r="3" /><circle cx="853" cy="333" r="3" /><circle cx="867" cy="333" r="3" /><circle cx="881" cy="333" r="3" />
      </g>
      <text x="867" y="320" fill="#d9e7df" font-size="9" font-weight="700" text-anchor="middle">REMOTE I/O</text>

      <rect x="929" y="301" width="104" height="65" rx="5" fill="#121d19" stroke="#4d8062" />
      <path d="M948 345 L962 318 976 345 990 318 1004 345" fill="none" stroke="#63f59c" stroke-width="2" />
      <text x="981" y="320" fill="#d9e7df" font-size="9" font-weight="700" text-anchor="middle">PROTECTED POWER</text>

      <path d="M885 275 V288 H1002 V275 M867 366 V394 H981 V366 M923 288 V394" fill="none" stroke="#315d45" stroke-width="2" />
      <circle cx="923" cy="288" r="4" fill="#63f59c" />
      <circle cx="923" cy="394" r="4" fill="#63f59c" />
      <rect x="823" y="394" width="210" height="34" rx="4" fill="#101b16" stroke="#315d45" />
      <path d="M838 411 H1018" stroke="#63f59c" stroke-width="2" stroke-dasharray="5 7" />
      <text x="923" y="450" fill="#668471" font-size="9" font-weight="650" text-anchor="middle" letter-spacing="1.5">LOCAL OBSERVATION BOUNDARY</text>

      <path d="M766 229 H712 L688 205" fill="none" stroke="#63f59c" stroke-width="2" />
      <circle cx="687" cy="204" r="6" fill="#0c1511" stroke="#63f59c" stroke-width="2" />
      <text x="677" y="188" fill="#90aa9b" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1.1">OBSERVE</text>

      <path d="M1081 257 H1133" fill="none" stroke="#63f59c" stroke-width="2" />
      <circle cx="1139" cy="257" r="6" fill="#0c1511" stroke="#63f59c" stroke-width="2" />
      <text x="1139" y="239" fill="#90aa9b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.1">ASSEMBLE</text>

      <path d="M1081 395 H1120 L1140 415" fill="none" stroke="#63f59c" stroke-width="2" />
      <circle cx="1145" cy="420" r="6" fill="#0c1511" stroke="#b7ffcf" stroke-width="2" />
      <text x="1146" y="444" fill="#90aa9b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.1">EVIDENCE</text>
