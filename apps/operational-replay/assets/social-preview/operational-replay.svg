        <path d="M-7 0 H7 M2 -5 L7 0 2 5" fill="none" stroke="#b7ffcf" stroke-width="2" />
        <text x="0" y="47" fill="#a6b7ad" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">ADVICE</text>
