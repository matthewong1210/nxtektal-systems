<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>NXTektal Operational Replay social preview</title>
  <desc>
    Repository-authored read-only operating-layer artwork with a conceptual
    Edge Gateway enclosure, connected evidence nodes, and NXTektal text branding.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050807" />
      <stop offset="0.56" stop-color="#0b100e" />
      <stop offset="1" stop-color="#111a16" />
    </linearGradient>
    <radialGradient id="gateway-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2d8d56" stop-opacity="0.22" />
      <stop offset="1" stop-color="#2d8d56" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23583a" />
      <stop offset="0.52" stop-color="#63f59c" />
      <stop offset="1" stop-color="#b7ffcf" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#31503f" stroke-opacity="0.13" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <ellipse cx="942" cy="285" rx="330" ry="330" fill="url(#gateway-glow)" />
  <path d="M0 88 H1200 M0 548 H1200" stroke="#98b8a6" stroke-opacity="0.12" />

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="64" y="73" fill="#edf5f0" font-size="29" font-weight="650" letter-spacing="8">
      <tspan fill="#63f59c">NXT</tspan><tspan>ektal</tspan>
    </text>
    <text x="64" y="111" fill="#7fa18f" font-size="12" font-weight="650" letter-spacing="3.7">
      SITE OPERATING LAYER · READ-ONLY EVIDENCE
    </text>

    <text x="62" y="218" fill="#edf5f0" font-size="68" font-weight="720" letter-spacing="-2">
      Operational
    </text>
    <text x="60" y="309" fill="#edf5f0" font-size="92" font-weight="760" letter-spacing="-3">
      Replay
    </text>
    <rect x="64" y="339" width="570" height="2" fill="url(#signal)" />
    <text x="64" y="379" fill="#b5c2bc" font-size="18" font-weight="520" letter-spacing="0.5">
      State → risk → advice → simulated task → outcome
    </text>
    <text x="64" y="412" fill="#6f8a7b" font-size="13" font-weight="600" letter-spacing="2.1">
      SIMULATION-DERIVED · PRESENTATION ONLY
    </text>

    <g aria-label="Operating-layer evidence sequence">
      <path d="M92 495 H625" stroke="#2d5f42" stroke-width="2" />
      <path d="M92 495 H625" stroke="url(#signal)" stroke-width="2" stroke-dasharray="3 13" />

      <g transform="translate(92 495)">
        <circle r="17" fill="#0d1612" stroke="#63f59c" stroke-width="2" />
        <circle r="5" fill="#63f59c" />
        <text x="0" y="47" fill="#a6b7ad" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">STATE</text>
      </g>
      <g transform="translate(225 495)">
        <circle r="17" fill="#0d1612" stroke="#63f59c" stroke-width="2" />
        <path d="M-7 5 L0 -7 7 5 Z" fill="none" stroke="#b7ffcf" stroke-width="2" />
        <text x="0" y="47" fill="#a6b7ad" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">RISK</text>
